    content="Shubham Singh — Computer Science Engineering student at KIIT Bhubaneswar. Passionate about AI, software development, and building real-world products." />
  <meta property="og:title" content="Shubham Singh — Portfolio" />

  <!-- JSON-LD SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",

    "jobTitle": "Computer Science Engineer",
    "url": "https://shubham1712portfolio.vercel.app/",
    "sameAs": [
      "https://github.com/Shubham-singh1712",
      "https://www.linkedin.com/in/shubham-singh-579059216/"
    ]
  }
  </script>

  <!-- Fonts -->
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&f[]=satoshi@400,500,700&display=swap"
    rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

  <link rel="stylesheet" href="/styles.css" />

  <style>
    @keyframes subtlePulse {
      0% { box-shadow: 0 0 0 0 oklch(from var(--color-primary) l c h / 0.4); }
      70% { box-shadow: 0 0 0 6px oklch(from var(--color-primary) l c h / 0); }
      100% { box-shadow: 0 0 0 0 oklch(from var(--color-primary) l c h / 0); }
    }
    .card-pulse {
      animation: subtlePulse 2.5s infinite;
    }
  </style>

</head>
<body>

<script>
    // GitHub API Integration
    fetch('https://api.github.com/users/Shubham-singh1712')
      .then(response => response.json())
      .then(data => {
        const repos = data.public_repos;
        if (repos !== undefined) {
          const stats = document.querySelectorAll('.stat');
          stats.forEach(stat => {
            if (stat.innerText.includes('Live Deployments')) {
              const numDiv = stat.querySelector('.stat-num');
              if (numDiv) {
                numDiv.setAttribute('data-count', repos);
                stat.querySelector('.stat-label').innerText = 'Public Repos';
              }
            }
          });
        }
      })
      .catch(err => console.log('GitHub fetch error:', err));
</script>

</body>
</html>
