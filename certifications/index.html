  <script>
    // Dark/light mode toggle with localStorage sync
    (function () {
      const t = document.querySelector('[data-theme-toggle]');
      const r = document.documentElement;
      const storedTheme = localStorage.getItem('theme');
      let d = storedTheme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
      
      r.setAttribute('data-theme', d);
      
      const sunIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
      const moonIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      
      if (t) {
        t.innerHTML = d === 'dark' ? sunIcon : moonIcon;
        t.setAttribute('aria-label', 'Switch to ' + (d === 'dark' ? 'light' : 'dark') + ' mode');
        t.addEventListener('click', () => {
          d = d === 'dark' ? 'light' : 'dark';
          r.setAttribute('data-theme', d);
          localStorage.setItem('theme', d);
          t.innerHTML = d === 'dark' ? sunIcon : moonIcon;
          t.setAttribute('aria-label', 'Switch to ' + (d === 'dark' ? 'light' : 'dark') + ' mode');
        });
      }
    })();

    // Typewriter effect
    (function () {
      const roles = [
        'Computer science Engineer',
        'Tech Explorer',
        'Web Developer',
        'Startup Enthusiast',
        'Video Creator'
      ];
      const el = document.getElementById('typedText');
      if (!el) return;
      let roleIdx = 0, charIdx = 0, deleting = false;
      function type() {
        const current = roles[roleIdx];
        if (!deleting) {
          el.textContent = current.slice(0, charIdx + 1);
          charIdx++;
          if (charIdx === current.length) {
            deleting = true;
            setTimeout(type, 1800);
            return;
          }
          setTimeout(type, 80);
        } else {
          el.textContent = current.slice(0, charIdx - 1);
          charIdx--;
          if (charIdx === 0) {
            deleting = false;
            roleIdx = (roleIdx + 1) % roles.length;
          }
          setTimeout(type, 40);
        }
      }
      setTimeout(type, 600);
    })();

    // Mobile menu
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    function closeMobileMenu() {
      mobileMenu.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
    }
    menuBtn.addEventListener('click', () => {
      const isOpen = mobileMenu.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', isOpen.toString());
    });

    
    
    // Project Filters
    const filterBtns = document.querySelectorAll('.filter-btn');
    const filterItems = document.querySelectorAll('.filter-item');
    
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filterValue = btn.getAttribute('data-filter');
        
        filterItems.forEach(item => {
          if (filterValue === 'all' || item.getAttribute('data-category').includes(filterValue)) {
            item.style.display = 'flex';
          } else {
            item.style.display = 'none';
          }
        });
      });
    });


    // Animated Counters
    const counters = document.querySelectorAll('.counter');
    const animateCounters = (entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const target = +entry.target.getAttribute('data-target');
          let count = 0;
          const speed = target / 50; 
          
          const updateCount = () => {
            count += speed;
            if (count < target) {
              entry.target.innerText = Math.ceil(count);
              requestAnimationFrame(updateCount);
            } else {
              entry.target.innerText = target;
            }
          };
          updateCount();
          observer.unobserve(entry.target);
        }
      });
    };
    const counterObserver = new IntersectionObserver(animateCounters, { threshold: 0.5 });
    counters.forEach(counter => counterObserver.observe(counter));


    // Back to top
    const btt = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      btt.classList.toggle('visible', window.scrollY > 400);
    }, { passive: true });
    btt.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  </script>

<script>

    // Custom Cursor Logic
    if (window.matchMedia("(pointer: fine)").matches) {
      const cursor = document.createElement('div');
      cursor.classList.add('custom-cursor');
      document.body.appendChild(cursor);
      document.body.classList.add('custom-cursor-active');

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let cursorX = mouseX;
      let cursorY = mouseY;
      
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      const renderCursor = () => {
        // smooth trailing effect
        cursorX += (mouseX - cursorX) * 0.2;
        cursorY += (mouseY - cursorY) * 0.2;
        cursor.style.transform = `translate(${cursorX - cursor.offsetWidth / 2}px, ${cursorY - cursor.offsetHeight / 2}px)`;
        requestAnimationFrame(renderCursor);
      };
      requestAnimationFrame(renderCursor);

      const interactiveElements = document.querySelectorAll('a, button, .project-card, .filter-btn, .theme-toggle, .menu-btn');
      interactiveElements.forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
      });
    }

    // Page Transitions
    document.querySelectorAll('a').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        const href = this.getAttribute('href');
        const target = this.getAttribute('target');
        
        if (href && href.startsWith('/') && target !== '_blank' && !href.includes('#')) {
          e.preventDefault();
          document.body.classList.add('page-fade-out');
          setTimeout(() => {
            window.location.href = href;
          }, 350);
        }
      });
    });

    // GitHub API Integration
    fetch('https://api.github.com/users/Shubham-singh1712')
      .then(response => response.json())
      .then(data => {
        const repos = data.public_repos;
        if (repos !== undefined) {
          // Find the card that says "Live Deployments" and swap it to "Public Repos"
          const cards = document.querySelectorAll('.project-card');
          cards.forEach(card => {
            if (card.innerText.includes('Live Deployments')) {
              const counterSpan = card.querySelector('.counter');
              if (counterSpan) {
                counterSpan.setAttribute('data-target', repos);
                card.querySelector('div:last-child').innerText = 'Public Repos';
              }
            }
          });
        }
      })
      .catch(err => console.log('GitHub fetch error:', err));

</script>
